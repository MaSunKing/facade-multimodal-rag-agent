name: design-source-checks
on: [push, pull_request]
jobs:
  source-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q backend scripts
      - run: python scripts/verify_design_release.py
      - run: python scripts/run_agent_eval_100.py
      - run: python scripts/audit_public_sources.py
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-test.txt
      - run: python -m unittest backend.tests.sales.test_review_admission backend.tests.sales.test_model_contract backend.tests.sales.test_runtime_status backend.tests.sales.test_staged_answer_graph backend.tests.sales.test_final_input
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test tests/attachment-snapshot.test.mjs tests/attachment-identity.test.mjs tests/trace-display.test.mjs
